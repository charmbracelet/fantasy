version: "2"
run:
  tests: false
linters:
  enable:
    - bodyclose
    - dupl
    # - exhaustive
    # - goconst
    - godot
    # - gomoddirectives
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    # - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    # - wrapcheck
  settings:
    dupl:
      threshold: 75
  exclusions:
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # cases.go is the shared fixture corpus: repeated case shapes are the
      # point of table-driven test data. The golden harness stays linted.
      - path: providers/internal/prompttest/cases.go
        linters:
          - dupl
    generated: lax
    presets:
      - common-false-positives
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
