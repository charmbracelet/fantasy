                "text": "Here is the most current and reliable data on Tokyo\u2019s population:\n\n\u2022 According to the preliminary results of Japan\u2019s 2025 national census (conducted as of October 1, 2025), the population of **Tokyo Metropolis** (Tokyo-to) was **14,246,219** residents ([metro.tokyo.lg.jp](https://www.metro.tokyo.lg.jp/information/press/2026/05/2026052914?utm_source=openai)).\n\n\u2022 A more recent estimate by the Tokyo Metropolitan Government, provided in its FY2025 City Profile, reports the total population as **14,273,066** as of 2025 ([tokyoupdates.metro.tokyo.lg.jp](https://www.tokyoupdates.metro.tokyo.lg.jp/en/brochure2026/pdf/tokyo2026.pdf?utm_source=openai)).\n\n\u2022 Another authority, a financial offering circular published in early 2026, indicates that as of March 1, 2026, Tokyo\u2019s population stood at approximately **14,262,000** (i.e., 14.262 million) ([rns-pdf.londonstockexchange.com](https://www.rns-pdf.londonstockexchange.com/rns/4629B_1-2026-4-22.pdf?utm_source=openai)).\n\nTo summarize:\n\n- **Most authoritative census count** (October 1, 2025): 14,246,219  \n- **Tokyo Metropolitan estimate** (2025): 14,273,066  \n- **Estimate as of March 1, 2026**: approximately 14,262,000  \n\nTherefore, the \u201ccurrent\u201d population of Tokyo (Tokyo Metropolis) is approximately **14.26 million**, based on the most recent estimates available up to early 2026.\n\nLet me know if you'd like population breakdowns by wards, urban agglomeration, or comparisons with Greater Tokyo or other regions!"
